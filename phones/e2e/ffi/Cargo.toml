[package]
name = "ortus-e2e-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "UniFFI bindings of ortus-e2e for the iOS and Android apps."
repository = "https://github.com/Ortus-Sovereign-Cloud/ortus-chat"
publish = false

# UniFFI is MPL-2.0, allowed by name in deny.toml for this library only
# (the owner, 2026-11-25). The binding generator is ../bindgen.

[lib]
name = "ortus_e2e_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
ortus-e2e = { path = ".." }
# The same version as ../bindgen, exactly.
uniffi = "=0.32.2"
